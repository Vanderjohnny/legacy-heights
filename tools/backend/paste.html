<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code.gs — copy helper</title>
<style>body{font-family:system-ui;padding:20px;background:#f6f6f6}textarea{width:100%;height:60vh;font:12px/1.4 ui-monospace,Consolas,monospace}button{font-size:16px;padding:10px 18px;margin:10px 0}#msg{font-weight:600}</style></head>
<body>
<h2>tools/backend/Code.gs</h2>
<p>Helper used while deploying the Apps Script: press the button to copy the whole script to the clipboard.</p>
<button id="copy">Copy Code.gs to clipboard</button> <span id="msg"></span>
<textarea id="src" spellcheck="false"></textarea>
<script>
fetch('Code.gs', { cache: 'no-store' }).then((r) => r.text()).then((t) => { document.getElementById('src').value = t; document.getElementById('msg').textContent = t.length + ' chars loaded'; });
document.getElementById('copy').onclick = async () => {
  const t = document.getElementById('src').value;
  try { await navigator.clipboard.writeText(t); document.getElementById('msg').textContent = 'copied ' + t.length + ' chars'; }
  catch (e) { const ta = document.getElementById('src'); ta.focus(); ta.select(); document.execCommand('copy'); document.getElementById('msg').textContent = 'copied (fallback) ' + t.length + ' chars'; }
};
</script>
</body></html>
